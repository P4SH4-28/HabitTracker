<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>E2E Friends Flow</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body { overflow: hidden; }
      #root { display: flex; height: 100%; flex: 1; }
    </style>
    <script>
      // --- Tohumlama: Alice hesabını uygulama mount olmadan önce yaz ---
      (function () {
        try {
          if (!localStorage.getItem('@habit_tracker_auth')) {
            function hashPassword(password, salt) {
              var input = (salt || 'habit_tracker_salt') + ':' + password;
              var h1 = 5381, h2 = 52711;
              for (var i = 0; i < input.length; i++) {
                var c = input.charCodeAt(i);
                h1 = ((h1 * 33) ^ c) >>> 0;
                h2 = ((h2 * 31) ^ c) >>> 0;
              }
              return h1.toString(16).padStart(8, '0') + h2.toString(16).padStart(8, '0');
            }
            localStorage.setItem(
              '@habit_tracker_auth',
              JSON.stringify({ name: 'AliceTest', passHash: hashPassword('1234') })
            );
          }
        } catch (e) {
          console.error('seed fail', e);
        }
      })();
    </script>
    <script src="/_expo/static/js/web/index-32aa8a9cc122d9e574bad6552c2d97ed.js" defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // --- Kontrol betiği: giriş → senkron → Bob istek → rozet → onay → red ---
      (function () {
        var body = document.body;
        var SERVER = 'http://localhost:3000';
        var ALICE = 'AliceTest';
        var BOB = 'BobTest';
        var CAROL = 'CarolTest';

        var sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
        var waitFor = async function (fn, tries) {
          var n = 0;
          var max = tries || 150;
          while (!fn()) {
            if (n++ >= max) return false;
            await sleep(300);
          }
          return true;
        };
        var $ = function (s) { return document.querySelector(s); };
        var setInput = function (el, value) {
          var setter = Object.getOwnPropertyDescriptor(Object.getPrototypeOf(el), 'value').set;
          setter.call(el, value);
          el.dispatchEvent(new Event('input', { bubbles: true }));
        };
        var clickEl = function (el) {
          el.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true }));
          el.dispatchEvent(new PointerEvent('pointerup', { bubbles: true }));
          // MouseEvent gerekli: RNW'nin PressResponder'ı event.altKey === false ister
          el.dispatchEvent(new MouseEvent('click', { bubbles: true }));
        };
        var exact = function (t) {
          return [].slice.call(document.querySelectorAll('div,span,a,button')).filter(function (e) {
            return e.textContent.trim() === t;
          });
        };
        var clickText = function (t) {
          var els = exact(t);
          if (!els.length) return false;
          clickEl(els[0]);
          return true;
        };
        var api = function (path, opts) {
          return fetch(SERVER + path, opts).then(function (r) { return r.json(); });
        };
        var fail = function (msg) {
          body.setAttribute('data-e2e-done', '1');
          body.setAttribute('data-e2e-fail', msg);
        };
        var triggerSync = function () {
          Object.defineProperty(document, 'visibilityState', { configurable: true, get: function () { return 'hidden'; } });
          document.dispatchEvent(new Event('visibilitychange', { bubbles: true }));
          Object.defineProperty(document, 'visibilityState', { configurable: true, get: function () { return 'visible'; } });
          document.dispatchEvent(new Event('visibilitychange', { bubbles: true }));
        };
        var findBell = function () {
          return [].slice.call(document.querySelectorAll('div')).find(function (d) {
            var t = d.textContent.trim();
            return t === '🔔' || t === '🔔1';
          });
        };

        (async function () {
          try {
            // JS hatalarını yakala (uygulama mount olmadan patlarsa sebebi görünsün)
            window.addEventListener('error', function (e) {
              try {
                var st = (e.error && e.error.stack) ? String(e.error.stack) : '';
                body.setAttribute('data-e2e-js-error', String(e.message || '').slice(0, 200));
                body.setAttribute('data-e2e-js-stack', st.slice(0, 900));
              } catch (_) {}
            });
            window.addEventListener('unhandledrejection', function (e) {
              try { body.setAttribute('data-e2e-js-reject', String(e.reason).slice(0, 300)); } catch (_) {}
            });

            // 1) Giriş formu gelene kadar bekle, Alice ile giriş yap
            var formOk = await waitFor(function () { return !!$('input[placeholder="İsim"]'); });
            if (!formOk) return fail('login form yok');
            setInput($('input[placeholder="İsim"]'), ALICE);
            setInput($('input[placeholder="Şifre"]'), '1234');
            await sleep(400);
            body.setAttribute('data-e2e-input-values', ($('input[placeholder="İsim"]').value || '') + '|' + ($('input[placeholder="Şifre"]').value || ''));
            clickText('Giriş Yap');
            var clickCount = 0;
            document.addEventListener('click', function () { clickCount++; }, true);
            var btn = exact('Giriş Yap')[0];
            body.setAttribute('data-e2e-btn-html', btn ? btn.outerHTML.slice(0, 260) : 'YOK');
            clickEl(btn);
            await sleep(400);
            body.setAttribute('data-e2e-clicks', String(clickCount));
            // Kontrol: geçiş butonu (Hesabın var mı?) tıklamayı algılıyor mu?
            var swList = exact('Hesabın yok mu? Kayıt ol');
            body.setAttribute('data-e2e-sw-count', String(swList.length));
            if (swList.length) {
              var sw = swList[0];
              var native = 0, rootGot = 0;
              sw.addEventListener('click', function (e) {
                native++;
                body.setAttribute('data-e2e-native', native + ':alt=' + e.altKey + ':trusted=' + e.isTrusted + ':tag=' + e.target.tagName);
              });
              var rootEl = document.getElementById('root');
              rootEl.addEventListener('click', function (e) {
                rootGot++;
                body.setAttribute('data-e2e-root-got', String(rootGot) + ':' + (e.target.tagName || e.target.nodeName));
              }, true);
              sw.click();
              await sleep(300);
              body.setAttribute('data-e2e-native-after', String(native));
              body.setAttribute('data-e2e-root-after', String(rootGot));
              var switched1 = exact('Hesabın var mı? Giriş yap').length > 0;
              body.setAttribute('data-e2e-switch-click', switched1 ? '1' : '0');
              if (!switched1) {
                var sw2 = swList[1] || sw;
                sw2.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true }));
                await sleep(300);
                var switched2 = exact('Hesabın var mı? Giriş yap').length > 0;
                body.setAttribute('data-e2e-switch-click', switched2 ? '1' : '0');
                body.setAttribute('data-e2e-switch-click-2', switched2 ? '1' : '0');
                body.setAttribute('data-e2e-root-after-2', String(rootGot));
              }
              body.setAttribute('data-e2e-mode', document.body.innerText.indexOf('Kayıt Ol') >= 0 ? 'kayit' : 'giris');
            } else {
              body.setAttribute('data-e2e-switch-click', 'YOK');
            }
            await sleep(1100);
            var afterClick = document.body.innerText;
            body.setAttribute('data-e2e-after-click', afterClick.slice(0, 160).replace(/\s+/g, ' '));
            var errText = exact('İsim girmelisin').length > 0 || exact('Şifre en az 4 karakter olmalı').length > 0 || exact('İsim veya şifre hatalı').length > 0;
            body.setAttribute('data-e2e-login-error', errText ? '1' : '0');

            var homeOk = await waitFor(function () { return document.body.innerText.indexOf('Günaydın') >= 0; });
            if (!homeOk) return fail('ana ekran yok');

            // 2) Alice sunucuya kaydolana kadar bekle (senkron)
            var regOk = await waitFor(function () {
              return api('/api/profiles/search?q=' + ALICE).then(function (r) {
                return !!(r.ok && r.results && r.results.some(function (p) { return p.name === ALICE; }));
              });
            }, 60);
            if (!regOk) return fail('Alice sunucuda yok');
            body.setAttribute('data-e2e-register', '1');

            // 3) Bob'u kaydet, XP ver, Alice'e istek gönder
            var bob = await api('/api/profiles/register', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ name: BOB }),
            });
            if (!bob.ok) return fail('Bob kaydı: ' + JSON.stringify(bob));
            await api('/api/profiles/update', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'x-device-token': bob.token },
              body: JSON.stringify({ xp: 4500, streak: 7 }),
            });
            var reqState = await api('/api/friends/request', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'x-device-token': bob.token },
              body: JSON.stringify({ name: ALICE }),
            });
            body.setAttribute('data-e2e-req-state', reqState.state || 'HATA');

            // 4) Alice'in cihaz token'ıyla isteğin sunucuda göründüğünü doğrula
            var aliceToken = localStorage.getItem('@habit_tracker_device_token') || '';
            body.setAttribute('data-e2e-has-token', aliceToken ? '1' : '0');
            if (aliceToken) {
              var rq = await api('/api/friends/requests', {
                headers: { 'x-device-token': aliceToken },
              });
              body.setAttribute('data-e2e-server-requests', (rq.data && rq.data.requests ? rq.data.requests : (rq.requests || [])).length);
            }

            // 5) AppState görünürlük taklası ile senkronu tetikle (60 sn poll beklemeden)
            triggerSync();

            // 6) Zil rozeti "1" olana kadar bekle
            var badgeOk = await waitFor(function () {
              return exact('1').length > 0;
            }, 60);
            body.setAttribute('data-e2e-badge', badgeOk ? '1' : '0');

            // 7) Gelen istek toast'ı
            var toastOk = document.body.innerText.indexOf('arkadaşlık isteği gönderdi') >= 0;
            body.setAttribute('data-e2e-incoming-toast', toastOk ? '1' : '0');

            // 8) Zile tıkla → sheet'te Bob + Onayla görünmeli
            var bellOk = await waitFor(function () { return !!findBell(); }, 40);
            if (!bellOk) return fail('zil bulunamadı');
            clickEl(findBell());
            await sleep(600);
            var sheetOk = document.body.innerText.indexOf(BOB) >= 0 && exact('Onayla').length > 0;
            body.setAttribute('data-e2e-sheet', sheetOk ? '1' : '0');
            if (!sheetOk) return fail('sheet açılmadı');

            // 9) Onayla → arkadaş toast'ı + istek listesi boşalır
            clickText('Onayla');
            var acceptOk = await waitFor(function () {
              return document.body.innerText.indexOf('ile artık arkadaşsınız') >= 0;
            }, 60);
            body.setAttribute('data-e2e-accept-toast', acceptOk ? '1' : '0');
            body.setAttribute('data-e2e-badge-after-accept', exact('1').length > 0 ? '1' : '0');

            // 10) Sheet'i kapat → Arkadaşlar sekmesinde BobTest olmalı
            clickText('✕');
            await sleep(400);
            var tabOk = await waitFor(function () {
              return exact('Arkadaşlar').length > 0;
            }, 40);
            if (tabOk) {
              clickEl(exact('Arkadaşlar')[0]);
              await waitFor(function () {
                return document.body.innerText.indexOf('BobTest') >= 0 || document.body.innerText.indexOf('Henüz arkadaş yok') >= 0;
              }, 40);
              body.setAttribute('data-e2e-friend-list', document.body.innerText.indexOf('BobTest') >= 0 ? '1' : '0');
            }

            // 11) Carol ekle, istek at; yeniden senkron; Reddet akışı
            var carol = await api('/api/profiles/register', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ name: CAROL }),
            });
            await api('/api/friends/request', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'x-device-token': carol.token },
              body: JSON.stringify({ name: ALICE }),
            });
            triggerSync();
            var badge2 = await waitFor(function () {
              return exact('1').length > 0;
            }, 60);
            body.setAttribute('data-e2e-badge2', badge2 ? '1' : '0');
            var bell2 = findBell();
            if (bell2) clickEl(bell2);
            await sleep(600);
            if (exact('Reddet').length > 0) {
              clickText('Reddet');
              var declineOk = await waitFor(function () {
                var sheetOpen = document.body.innerText.indexOf('Gelen İstekler') >= 0;
                var empty = document.body.innerText.indexOf('Bekleyen istek yok') >= 0;
                return sheetOpen && empty;
              }, 40);
              body.setAttribute('data-e2e-decline', declineOk ? '1' : '0');
              if (aliceToken) {
                var rq2 = await api('/api/friends/requests', {
                  headers: { 'x-device-token': aliceToken },
                });
                var list2 = (rq2.data && rq2.data.requests ? rq2.data.requests : (rq2.requests || []));
                body.setAttribute('data-e2e-server-after-decline', list2.length);
              }
            } else {
              body.setAttribute('data-e2e-decline', '0');
            }

            // 12) Liderlik sunucu verisi: ikisi de listede mi?
            var lb = await api('/api/leaderboard?limit=50');
            var names = (lb.data && lb.data.players ? lb.data.players : (lb.players || [])).map(function (p) { return p.name; });
            body.setAttribute('data-e2e-leaderboard', names.indexOf(ALICE) >= 0 && names.indexOf(BOB) >= 0 ? '1' : '0');

            body.setAttribute('data-e2e-done', '1');
            body.setAttribute('data-e2e-fail', '');
          } catch (e) {
            body.setAttribute('data-e2e-done', '1');
            body.setAttribute('data-e2e-fail', 'istisna: ' + (e && e.message ? e.message : String(e)));
          }
        })();
      })();
    </script>
  </body>
</html>
