name: Android APK Build

# İş akışının ne zaman otomatik tetikleneceğini belirliyoruz
on:
  push:
    branches:
      - main
      - master
    # Yalnızca doküman/simge dışı değişikliklerde derle
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'supabase/**'
      - 'supabase-*.sql'
      - 'HabitTracker.apk' # Derleme sonrası APK'nın depoya geri yüklenmesi yeni build tetiklemesin
  workflow_dispatch: # GitHub arayüzünden manuel "Çalıştır" butonu ekler

jobs:
  build-android:
    runs-on: ubuntu-latest
    # Build sonrası APK'yı depoya geri itebilmek için yazma izni
    permissions:
      contents: write

    steps:
      # 1. ADIM: Depodaki proje kodlarını sanal sunucuya çekiyoruz
      - name: Kodları Çek (Checkout)
        uses: actions/checkout@v4

      # 2. ADIM: Node.js ortamını ayarlıyoruz
      - name: Node.js Ortamını Kur
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. ADIM: React Native için gerekli Java (JDK 17) ortamını kuruyoruz
      - name: Java JDK 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 4. ADIM: Android SDK araçlarını yüklüyoruz
      - name: Android SDK Kur
        uses: android-actions/setup-android@v3

      # 5. ADIM: Proje bağımlılıklarını yüklüyoruz
      - name: Paketleri Yükle (npm install)
        run: npm ci

      # 6. ADIM: Expo yapısını yerel Android klasörüne dönüştürüyoruz
      - name: Expo Prebuild Oluştur
        run: npx expo prebuild --platform android

      # 7. ADIM: Release imzasını kuruyoruz (Play Store için gerçek anahtar)
      # Keystore, GitHub Actions Secrets'ında base64 saklanır (depoda DEĞİL):
      #   ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD /
      #   ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD
      # keystore.properties + build.gradle yaması ile release imzası
      # debug anahtarı yerine gerçek anahtara çevrilir.
      - name: Release İmzası Kur (keystore.properties + build.gradle)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -e
          if [ -z "$KEYSTORE_B64" ]; then
            echo "!! ANDROID_KEYSTORE_BASE64 secret'i yok — debug imzasıyla derleniyor (Play Store için Secrets eklemelisin)."
            exit 0
          fi
          mkdir -p android/keystore
          echo "$KEYSTORE_B64" | base64 -d > android/keystore/release.keystore
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$PWD/android/keystore/release.keystore" "$KS_PASS" "$KEY_ALIAS" "$KEY_PASS" \
            > android/keystore.properties
          python3 - <<'PY'
          import re
          path = 'android/app/build.gradle'
          src = open(path, encoding='utf-8').read()
          if 'keystoreProperties' not in src:
              src = src.replace(
                  'android {',
                  "def keystoreProperties = new Properties()\n"
                  "def keystorePropertiesFile = rootProject.file('keystore.properties')\n"
                  "if (keystorePropertiesFile.exists()) {\n"
                  "    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))\n"
                  "}\n\n"
                  "android {",
                  1,
              )
              src = src.replace(
                  'signingConfigs {\n        debug {',
                  'signingConfigs {\n        release {\n'
                  "            storeFile file(keystoreProperties['storeFile'])\n"
                  "            storePassword keystoreProperties['storePassword']\n"
                  "            keyAlias keystoreProperties['keyAlias']\n"
                  "            keyPassword keystoreProperties['keyPassword']\n"
                  '        }\n        debug {',
                  1,
              )
              src = re.sub(
                  r'(\brelease \{\n.*?)signingConfig signingConfigs\.debug',
                  r'\1signingConfig signingConfigs.release',
                  src,
                  count=1,
                  flags=re.S,
              )
              open(path, 'w', encoding='utf-8').write(src)
              ok = 'keystoreProperties' in src and 'signingConfigs.release' in src
          else:
              ok = True
          if not ok:
              print('!! build.gradle yamalanamadi — debug imzasi ile devam ediliyor')
          else:
              print('Imza yapilandirmasi tamam')
          PY

      # 8. ADIM: Gradle ile APK + AAB derle
      # versionCode her build'de run_number ile artar (Play yüklemesi şartı).
      - name: APK + AAB Derle (Gradle)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon \
            -Pandroid.injected.versionCode=${{ github.run_number }}
          ls -la app/build/outputs/apk/release/ app/build/outputs/bundle/release/

      # 9. ADIM: Oluşan dosyaları GitHub Actions sekmesine indirme linki olarak yüklüyoruz
      - name: APK + AAB Dosyalarını Kaydet (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: HabitTracker-App-Release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      # 10. ADIM: APK + AAB'yi GitHub Release'e ekliyoruz (sabit indirme linki)
      # Her derlemede en yeni dosyalar "latest" release'ine yüklenir.
      # İndirme linkleri:
      #   APK: https://github.com/P4SH4-28/HabitTracker/releases/latest/download/HabitTracker.apk
      #   AAB: https://github.com/P4SH4-28/HabitTracker/releases/latest/download/app-release.aab
      - name: Release Oluştur (Latest APK + AAB)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: En Son Sürüm (Build #${{ github.run_number }})
          body: |
            Otomatik derlenen en güncel sürüm.

            - APK (telefon kurulumu): `https://github.com/P4SH4-28/HabitTracker/releases/latest/download/HabitTracker.apk`
            - AAB (Play Store yüklemesi): `https://github.com/P4SH4-28/HabitTracker/releases/latest/download/app-release.aab`
            - Build zamanı: $(date -u)
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          make_latest: 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 11. ADIM: APK'yı depo kök dizinine kopyalayıp main dalına itiyoruz.
      # Böylece README'nin altında dosya listesinde "HabitTracker.apk" görünür
      # ve GitHub'dan tek tıkla indirilebilir.
      - name: APK'yı Depoya Geri Yükle (README Yanına)
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk HabitTracker.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HabitTracker.apk
          git commit -m "chore: güncel APK derlemesi" || echo "APK değişmemiş, commit atlanıyor"
          git push origin main